<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#cp-bg)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#60A5FA" stroke-width="0.8" stroke-opacity="0.3" />

  <!-- Code Chevron Left: < -->
  <path d="M 10 10.5 L 5.5 16 L 10 21.5" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Slash: / -->
  <path d="M 17.5 9.5 L 14 22.5" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />

  <!-- Code Chevron Right: > -->
  <path d="M 22 10.5 L 26.5 16 L 22 21.5" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AI Sparkle at Top-Right -->
  <path d="M 24.5 4 Q 24.5 7.5 28 7.5 Q 24.5 7.5 24.5 11 Q 24.5 7.5 21 7.5 Q 24.5 7.5 24.5 4 Z" fill="url(#sparkle-grad)" filter="url(#glow)" />
  <circle cx="24.5" cy="7.5" r="0.75" fill="#FFFFFF" />
</svg>
